startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      birdnetBaseUrl:
        type: string
        description: "BirdNET-Go REST API URL"
        default: "http://localhost:8080"
      clipsBaseUrl:
        type: string
        description: "Audio clips file server URL"
        default: "http://localhost:8091"
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'birdnet-go-mcp', 'serve'],
      env: {
        BIRDNET_BASE_URL: config.birdnetBaseUrl || 'http://localhost:8080',
        CLIPS_BASE_URL: config.clipsBaseUrl || 'http://localhost:8091'
      }
    })
