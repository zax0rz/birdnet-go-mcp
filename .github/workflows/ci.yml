name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.24']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Run unit tests
        run: go test -v -race ./...

      - name: Build binary
        run: go build -v ./cmd/birdnet-mcp

      - name: Test npm runner script
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node bin/run.js version
